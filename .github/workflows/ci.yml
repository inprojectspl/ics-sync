name: CI

# Tests on every push and pull request. The container image is built for
# pull requests too, but published to ghcr.io only from main and release tags:
#   :<sha>, :latest   every commit on main
#   :<x.y.z>, :1      a release tag v1.x.y; :1 is the stable major clients pin
on:
  push:
    branches: [main]
    tags: ["v1.*.*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w ."; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  image:
    name: Container image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          version="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="${GITHUB_SHA::7}"
          docker build --build-arg VERSION="$version" -t "$IMAGE:$GITHUB_SHA" .
          docker run --rm "$IMAGE:$GITHUB_SHA" --version
      - name: Publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags="${GITHUB_REF_NAME#v} 1"
          else
            docker push "$IMAGE:$GITHUB_SHA"
            tags="latest"
          fi
          for tag in $tags; do
            docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
